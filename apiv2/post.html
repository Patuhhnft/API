<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="post"></div>
    <p id="loading" class="hide">Carregando...</p>
    <a href="index.html">Voltar</a>
    <div id="post-container"></div>
    <h2>Comentários:</h2>
    <form id="comment-form">
        <div>
            <label for="email">Seu e-mail:</label>
            <input type="email" name="email" id="email" placeholder="e-mail" required autocomplete="email">
        </div>
        <div>
            <label for="body">Seu comentário</label>
            <textarea name="body" id="body" placeholder="Digite seu comentário" required></textarea>
        </div>
        <input type="submit" value="Enviar">
    </form>
    <div id="comments-container"></div>
    <script src="js/scripts.js"></script>
</body>
</html>
